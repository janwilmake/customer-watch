<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9c9d1"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="16" fill="#16161d"/>
  <text x="48" y="62" font-size="28" font-weight="700" fill="#ffffff">customer-watch closes the loop</text>

  <rect x="48" y="220" width="190" height="90" rx="14" fill="#1d3329" stroke="#4fd18b" stroke-width="2"/>
  <text x="143" y="272" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Customer</text>

  <rect x="330" y="110" width="290" height="90" rx="14" fill="#1c2b4d" stroke="#5fa8ff" stroke-width="2"/>
  <text x="475" y="150" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">customer-watch</text>
  <text x="475" y="176" font-size="14" fill="#c9d6f0" text-anchor="middle">knows every conversation</text>

  <rect x="700" y="200" width="452" height="130" rx="16" fill="none" stroke="#4a4a5a" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="716" y="226" font-size="13" fill="#8a8a99">your pipeline</text>
  <rect x="716" y="242" width="120" height="70" rx="12" fill="#262633" stroke="#50505f"/>
  <text x="776" y="283" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Ticket</text>
  <rect x="874" y="242" width="120" height="70" rx="12" fill="#262633" stroke="#50505f"/>
  <text x="934" y="283" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">PR</text>
  <rect x="1016" y="242" width="120" height="70" rx="12" fill="#262633" stroke="#50505f"/>
  <text x="1076" y="283" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Production</text>
  <path d="M836,277 H868" stroke="#c9c9d1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M994,277 H1010" stroke="#c9c9d1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="330" y="350" width="290" height="90" rx="14" fill="#1c2b4d" stroke="#5fa8ff" stroke-width="2"/>
  <text x="475" y="390" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">customer-watch</text>
  <text x="475" y="416" font-size="14" fill="#c9d6f0" text-anchor="middle">drafts “it’s live” + next step</text>

  <path d="M143,220 V155 H324" stroke="#c9c9d1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="160" y="143" font-size="14" font-weight="700" fill="#ffffff">contact</text>

  <path d="M620,155 H776 V236" stroke="#c9c9d1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="640" y="143" font-size="14" font-weight="700" fill="#ffffff">ticket</text>

  <path d="M1076,312 V395 H626" stroke="#c9c9d1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="700" y="383" font-size="14" font-weight="700" fill="#ffffff">merged</text>

  <path d="M330,395 H143 V316" stroke="#c9c9d1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="160" y="383" font-size="14" font-weight="700" fill="#ffffff">told, same day</text>

  <text x="48" y="490" font-size="15" fill="#8a8a99">Claude Code made the middle fast. customer-watch handles both ends.</text>
</svg>
